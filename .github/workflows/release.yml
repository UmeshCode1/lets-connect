name: Release & Marketplace Tagging

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version tag (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build wheel

      - name: Run complete test suite
        run: |
          python -m unittest discover tests

      - name: Build distribution package
        run: |
          python -m build

      - name: Extract major version tag
        id: versioning
        run: |
          TAG_NAME="${{ github.ref_name || inputs.version }}"
          MAJOR_TAG=$(echo "$TAG_NAME" | cut -d. -f1)
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "major_tag=$MAJOR_TAG" >> $GITHUB_OUTPUT

      - name: Update Floating Major Version Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "${{ steps.versioning.outputs.major_tag }}" -m "Release ${{ steps.versioning.outputs.tag_name }}"
          git push origin "${{ steps.versioning.outputs.major_tag }}" --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: Release ${{ steps.versioning.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
