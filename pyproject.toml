[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "github-activity-lab"
version = "1.0.0"
authors = [
  { name="Umesh Patel", email="umesh.code1@gmail.com" },
]
description = "A lightweight utility suite, GitHub Marketplace Action, and AI PR reviewer for tracking repository contributions and achievement milestones."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Version Control :: Git",
    "Development Status :: 5 - Production/Stable",
]
keywords = ["github-action", "git", "co-authors", "github-achievements", "pull-shark", "pair-extraordinaire", "claude-ai"]

[project.urls]
"Homepage" = "https://github.com/UmeshCode1/lets-connect"
"Bug Tracker" = "https://github.com/UmeshCode1/lets-connect/issues"
"Source" = "https://github.com/UmeshCode1/lets-connect"


[project.scripts]
activity-lab = "activity_lab.cli:main"
